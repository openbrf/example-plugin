name: Release

# Publishes the version a `v<version>` tag names: one tarball, packed once,
# checked, attested and attached to a GitHub release this workflow creates.
#
# The catalog lists a plugin only from an immutable release of the repository
# its source lives in, with a build attestation made by that repository's own
# workflow, on a GitHub-hosted runner, for the release's tag
# (`gh attestation verify <file> --repo openbrf/example-plugin
# --source-ref refs/tags/v<version> --deny-self-hosted-runners`). So this runs
# on the tag push and nowhere else. Do not publish the release from the GitHub
# UI first: that creates the tag, the tag push then starts this workflow after
# the release is already immutable, and the upload fails.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Pack, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Create the release and upload the tarball.
      contents: write
      # The signing certificate for the attestation, and its record.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check the tagged commit is on main.
          fetch-depth: 0

      - name: Check the tag names this version, on main
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF}" != "refs/tags/v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF#refs/tags/}, but package.json is at version ${version}. Tag v${version}, or change the version in a pull request first."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::v${version} points at a commit that is not on main. Release only what main has merged."
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: what goes into a release is installed from
          # the lockfile alone.

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds `dist/`, which the pack below takes as it is.
      - run: pnpm test

      - name: Pack the tarball
        run: |
          mkdir release
          npm pack --ignore-scripts --json --pack-destination release > release/pack.json
          filename="$(node -p 'require("./release/pack.json")[0].filename')"
          echo "TARBALL=release/${filename}" >> "${GITHUB_ENV}"

      # The same file is checked, attested and uploaded: what the catalog
      # verifies is byte for byte what passed here.
      - name: Check the tarball as the catalog will
        run: node scripts/check-package.mjs "${TARBALL}"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha512="sha512-$(openssl dgst -sha512 -binary "${TARBALL}" | base64 -w0)"
          bytes="$(stat -c %s "${TARBALL}")"
          name="$(basename "${TARBALL}")"
          {
            echo "The plugin tarball for the catalog, built and attested by this repository's release workflow for \`v${VERSION}\`."
            echo
            echo '```'
            echo "file    ${name}"
            echo "sha512  ${sha512}"
            echo "bytes   ${bytes}"
            echo '```'
            echo
            echo "Verify it with:"
            echo
            echo '```'
            echo "gh attestation verify ${name} --repo ${GITHUB_REPOSITORY} --source-ref refs/tags/v${VERSION} --deny-self-hosted-runners"
            echo '```'
            echo
            echo "What changed is in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
          } > release/notes.md
          # With an asset to attach, gh creates the release as a draft,
          # uploads the asset and only then publishes it, so the immutable
          # release is never seen without its tarball.
          gh release create "v${VERSION}" "${TARBALL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file release/notes.md
